# 取得元ページの表構造を確認するための手動ワークフロー。
#
# 目的: CLAUDE.md の次タスク1（dpu_history のパーサを実構造に合わせる）を進める。
# 開発セッション側のネットワークポリシーが japan-reit.com を遮断しているため、
# 到達できる可能性のある実行基盤として Actions を使う。
#
# 未検証: Actions ランナーから japan-reit.com に到達できるかは、実際に走らせるまで不明。
#
# このリポジトリは public なので Actions のログも公開される。
# JAPAN-REIT.COM は転載・複製禁止のため、出力は表のヘッダ名と行列数だけに限定する。
# ページ本文・データ行・HTML は一切ログにも artifact にも出さない。
name: inspect-sources

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "確認する銘柄コード（スペース区切り）"
        required: false
        default: "8985"
      source:
        description: "取得元"
        required: false
        default: japan_reit
        type: choice
        options: [japan_reit, haitoukabu]
      sleep:
        description: "銘柄間の待機秒数（2 以上）"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 入力チェック
        env:
          CODES: ${{ inputs.codes }}
          SLEEP: ${{ inputs.sleep }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          codes = os.environ["CODES"].split()
          if not codes or len(codes) > 10:
              sys.exit(f"銘柄コードは 1〜10 件にしてください（指定: {len(codes)} 件）")
          bad = [c for c in codes if not re.fullmatch(r"[0-9A-Z]{4}", c)]
          if bad:
              sys.exit(f"銘柄コードの形式が不正です: {bad}")
          if float(os.environ["SLEEP"]) < 2:
              sys.exit("アクセス間隔は 2 秒以上にしてください")
          print("codes=%s sleep=%s" % (codes, os.environ["SLEEP"]))
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: パーサのフィクスチャ検証（取得前に通しておく）
        run: PYTHONPATH=. python tests/test_ingest.py

      - name: DPU 履歴ページの表構造を確認
        env:
          CODES: ${{ inputs.codes }}
          SOURCE: ${{ inputs.source }}
          SLEEP: ${{ inputs.sleep }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m jreit_score.ingest.dpu_history \
            $CODES --source "$SOURCE" --inspect --sleep "$SLEEP"
