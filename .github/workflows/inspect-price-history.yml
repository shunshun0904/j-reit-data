# 1 銘柄の 20 年程度の月次価格を確認する（個人利用）。J-Quants の現プランは直近 10 年しか
# 取れないため、Yahoo Finance（yfinance）から取って要約統計と図だけを出す。生データは出さない。
name: inspect-price-history

on:
  workflow_dispatch:
    inputs:
      code:
        description: "銘柄コード（4桁）"
        required: false
        default: "8972"
      years:
        description: "遡る年数"
        required: false
        default: "20"
      split_dates:
        description: "分割の効力発生日（YYYY-MM-DD をカンマ区切り。調整の有無の確認用。空なら確認しない）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy matplotlib yfinance

      - name: 取得と要約
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m jreit_score.ingest.price_history "${{ inputs.code }}" --years "${{ inputs.years }}" \
            --out out --split-dates "${{ inputs.split_dates }}"

      - uses: actions/upload-artifact@v4
        with:
          name: price-history-${{ inputs.code }}
          path: out/*.png
          retention-days: 7
          if-no-files-found: warn
