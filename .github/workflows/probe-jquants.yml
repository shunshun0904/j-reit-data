# J-Quants V2 の実応答の「形」を確認する手動ワークフロー。
#
# ベースURL・認証・パス・列名は公式クライアント（jquants-api-client 2.7.0）の
# ソースから確定済み。ここで確かめるのは仕様ページ（403）でしか分からない3点:
#   ProdCat のどの値が REIT か / FRCode のどの値が実績か / 分配金は DivRate か DistAmt か
#
# 出力は列名・件数・列ごとの非null件数・小さな列挙の値集合のみ。レコードは出さない
# （J-Quants のデータは再配布不可）。APIキーも出さない。
name: probe-jquants

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover=応答の形を確認 / census=全 J-REIT の決算期間分布と除外銘柄を数える"
        required: false
        default: discover
        type: choice
        options: [discover, census]
      codes:
        description: "mode=discover のとき確認する銘柄コード（4桁, スペース区切り）"
        required: false
        default: "8985 8951"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: APIキーの登録名を確認
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          set -euo pipefail
          found=""
          [ -n "${JQUANTS_API_KEY:-}" ] && found="JQUANTS_API_KEY"
          [ -z "$found" ] && [ -n "${JQUANTS_API:-}" ] && found="JQUANTS_API"
          if [ -z "$found" ]; then
            echo "::error::JQUANTS_API_KEY も JQUANTS_API も未登録です。"
            exit 1
          fi
          echo "APIキー: $found として登録あり（値は出力しません）"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 整形層のフィクスチャ検証（取得前に通しておく）
        run: PYTHONPATH=. python tests/test_jquants.py

      - name: 実応答の形を確認
        if: ${{ inputs.mode == 'discover' }}
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
          CODES: ${{ inputs.codes }}
        run: PYTHONPATH=. python -m jreit_score.ingest.jquants --discover --codes $CODES

      # 58 銘柄 × 1 リクエスト（＋ページング）。銘柄間 0.5 秒で 1 分程度
      - name: 全 J-REIT の決算期間分布と除外銘柄を数える
        if: ${{ inputs.mode == 'census' }}
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: PYTHONPATH=. python -m jreit_score.ingest.jquants --census
